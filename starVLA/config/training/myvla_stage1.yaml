run_id: myvla_stage1
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: starVLA
is_debug: false

framework:
  name: QwenMyVLA
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: eager
    vl_hidden_dim: 2560

  lam_stage2:
    ckpt_path: /mnt/nas_ssd/workspace/wenboli/projects/starVLA/playground/Pretrained_models/univla-latent-action-model/lam-stage-2.ckpt
    in_dim: 3
    model_dim: 768
    latent_dim: 128
    num_latents: 16
    patch_size: 14
    enc_blocks: 12
    dec_blocks: 12
    num_heads: 12
    freeze: true

  depth_encoder:
    checkpoint_path: /mnt/nas_ssd/workspace/wenboli/projects/starVLA/playground/Pretrained_models/Depth-Anything-V2-Large
    encoder: vitl
    features: 256
    out_channels: [256, 512, 1024, 1024]
    input_size: 518
    freeze: true

  qwen3_embedding:
    model_path: /mnt/nas_ssd/workspace/wenboli/projects/starVLA/playground/Pretrained_models/Qwen3-Embedding-0.6B
    max_length: 128
    pooling: mean
    freeze: true
    trust_remote_code: true
    num_subtask_slots: 4

  slot_dynamic:
    num_slots: 4
  slot_spatial:
    num_slots: 16
  slot_subtask:
    num_slots: 4

  slot_fuse:
    num_blocks: 2
    mlp_ratio: 2.0

  slot_align_loss:
    enable: true
    dynamic: 1.0
    spatial: 1.0
    subtask: 1.0
    mse_ratio: 1.0
    cos_ratio: 1.0
    masked_target_prediction: false
    masked_only: false
    unmasked_weight: 1.0
    fallback_to_all_when_no_masked: true

  continuous_fm_loss:
    weight: 0.0
    detach: false
    objective: fm
    loss_type: mse
    noise_scale: 1.0
    t_eps: 1.0e-3

  fast_action_loss:
    enable: false
    weight: 0.0
    detach: false

  action_model:
    hidden_dim: 2560
    action_dim: 7
    num_actions_chunk: 8
    action_query_num: 24
    use_pro_version: false

  stage3_action_header:
    enable: false
    action_query_num: 24
    hidden_dim: 2560
    num_blocks: 8
    use_pro_version: false

  slot_placeholders:
    dynamic: "<slot_dynamic>"
    spatial: "<slot_spatial>"
    subtask: "<slot_subtask>"
    action: "<slot_action>"

  slot_boundary_tokens:
    dynamic_start: "<SOSD>"
    dynamic_end: "<EOSD>"
    spatial_start: "<SOSS>"
    spatial_end: "<EOSS>"
    subtask_start: "<SOST>"
    subtask_end: "<EOST>"
    action_start: "<SOSA>"
    action_end: "<EOSA>"

  slot_mask:
    enable: false
    apply_in_eval: false
    inner:
      dynamic: 0.0
      spatial: 0.0
      subtask: 0.0
    outside:
      num_masked_probs: [1.0, 0.0, 0.0, 0.0]

  attention_mask:
    enable_apply: true
    visibility:
      text:
        text: true
        image: true
        subtask: true
        dynamic: true
        spatial: true
      image:
        text: true
        image: true
        subtask: false
        dynamic: false
        spatial: true
      subtask:
        text: true
        image: false
        subtask: true
        dynamic: false
        spatial: false
      dynamic:
        text: true
        image: false
        subtask: false
        dynamic: true
        spatial: false
      spatial:
        text: false
        image: true
        subtask: false
        dynamic: false
        spatial: true
    stage_visibility:
      stage1:
        text:
          text: true
          image: true
          subtask: true
          dynamic: true
          spatial: true
          action: false
        image:
          text: true
          image: true
          subtask: false
          dynamic: false
          spatial: true
          action: false
        subtask:
          text: true
          image: false
          subtask: true
          dynamic: false
          spatial: false
          action: false
        dynamic:
          text: true
          image: false
          subtask: false
          dynamic: true
          spatial: false
          action: false
        spatial:
          text: false
          image: true
          subtask: false
          dynamic: false
          spatial: true
          action: false
        action:
          text: false
          image: false
          subtask: false
          dynamic: false
          spatial: false
          action: true

  return_debug_tensors: false
  strict_loss_checks: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs: ["video.primary_image"]
    temporal_video_delta_indices: [0, 19]
    image_size: [224, 224]
    video_backend: torchvision_av

trainer:
  stage_name: stage1
  epochs: 100
  max_train_steps: 1000000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    dynamic_teacher_encoder: 1.0e-05
    spatial_teacher_encoder: 1.0e-05
    subtask_slot_encoder: 1.0e-05
    dynamic_projector: 1.0e-04
    spatial_compressor: 1.0e-04
    subtask_compressor: 1.0e-04
    action_predictor: 1.0e-04
    stage3_action_head: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: 'param_regex:\.self_attn\.,param_regex:\.mlp\.experts\.action\.,qwen_vl_interface.model.lm_head,fast_action_model,action_predictor,coarse_action_state_proj,param_regex:^action_token_queries$'
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
