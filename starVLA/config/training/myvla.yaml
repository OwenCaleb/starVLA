run_id: myvla_lam_stage2
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: starVLA
is_debug: false

# Model and teacher stack for QwenMyVLA.
framework:
  name: QwenMyVLA
  qwenvl:
    # Local path of Qwen-VL backbone (or HF repo id if online loading is used).
      base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560

  lam_stage2:
    ckpt_path: /mnt/nas_ssd/workspace/wenboli/projects/starVLA/playground/Pretrained_models/univla-latent-action-model/lam-stage-2.ckpt
    in_dim: 3
    model_dim: 768
    latent_dim: 128
    num_latents: 16
    patch_size: 14
    enc_blocks: 12
    dec_blocks: 12
    num_heads: 12
    freeze: true

  depth_encoder:
    checkpoint_path: /mnt/nas_ssd/workspace/wenboli/projects/starVLA/playground/Pretrained_models/Depth-Anything-V2-Large
    encoder: vitl
    features: 256
    out_channels: [256, 512, 1024, 1024]
    input_size: 518
    freeze: true

  qwen3_embedding:
    model_path: /mnt/nas_ssd/workspace/wenboli/projects/starVLA/playground/Pretrained_models/Qwen3-Embedding-0.6B
    max_length: 128
    pooling: mean
    freeze: true
    trust_remote_code: true
    num_subtask_slots: 4

  slot_dynamic:
    num_slots: 4
  slot_spatial:
    num_slots: 16
  slot_subtask:
    num_slots: 4

  # Slot readout fuser (MLP-only, no attention).
  slot_fuse:
    num_blocks: 2
    mlp_ratio: 2.0

  # Stage-I/II slot alignment losses.
  slot_align_loss:
    enable: true
    dynamic: 1.0
    spatial: 1.0
    subtask: 1.0
    mse_ratio: 1.0
    cos_ratio: 1.0
    masked_target_prediction: true
    masked_only: true
    unmasked_weight: 0.0
    fallback_to_all_when_no_masked: true

  # Continuous action branch (FM objective).
  continuous_fm_loss:
    weight: 1.0
    detach: false
    objective: fm
    loss_type: mse
    noise_scale: 1.0
    t_eps: 1.0e-3

  fast_action_loss:
    enable: false
    weight: 1.0
    detach: false

  # Base action tensor shape used by predictor heads.
  action_model:
    hidden_dim: 2560
    action_dim: 7
    num_actions_chunk: 8
    action_query_num: 24
    use_pro_version: false

  # Stage-III adapter head. Keep disabled for Stage-I/II training.
  stage3_action_header:
    enable: false
    action_query_num: 24
    hidden_dim: 2560
    num_blocks: 8
    use_pro_version: false

  slot_placeholders:
    dynamic: "<slot_dynamic>"
    spatial: "<slot_spatial>"
    subtask: "<slot_subtask>"
    action: "<slot_action>"

  slot_boundary_tokens:
    dynamic_start: "<SOSD>"
    dynamic_end: "<EOSD>"
    spatial_start: "<SOSS>"
    spatial_end: "<EOSS>"
    subtask_start: "<SOST>"
    subtask_end: "<EOST>"
    action_start: "<SOSA>"
    action_end: "<EOSA>"

  # Group-wise slot masking for scaffold annealing.
  slot_mask:
    enable: false
    apply_in_eval: false
    inner:
      dynamic: 0.0
      spatial: 0.0
      subtask: 0.0
    outside:
      num_masked_probs: [0.0, 1.0, 0.0, 0.0]

  # Typed visibility matrix for text/image/subtask/dynamic/spatial tokens.
  attention_mask:
    enable_apply: true
    visibility:
      text:
        text: true
        image: true
        subtask: true
        dynamic: true
        spatial: true
      image:
        text: true
        image: true
        subtask: false
        dynamic: false
        spatial: true
      subtask:
        text: true
        image: false
        subtask: true
        dynamic: false
        spatial: false
      dynamic:
        text: true
        image: false
        subtask: false
        dynamic: true
        spatial: false
      spatial:
        text: false
        image: true
        subtask: false
        dynamic: false
        spatial: true

  return_debug_tensors: false
  strict_loss_checks: true

# VLA dataset loader settings.
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/OXE_LEROBOT_DATASET
    data_mix: bridge_rt_1
    action_type: delta_ee
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: [224, 224]
    video_backend: torchvision_av

# Trainer follows starVLA's common optimizer/scheduler conventions.
trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1.0e-05
    # Module-wise LR groups consumed by build_param_lr_groups().
    qwen_vl_interface: 1.0e-05
    dynamic_teacher_encoder: 1.0e-05
    spatial_teacher_encoder: 1.0e-05
    subtask_slot_encoder: 1.0e-05
    dynamic_projector: 1.0e-04
    spatial_compressor: 1.0e-04
    subtask_compressor: 1.0e-04
    action_predictor: 1.0e-04
    stage3_action_head: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
